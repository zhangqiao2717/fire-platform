name: 同步巡查飞书数据

on:
  schedule:
    # 每日 UTC 00:15 = 北京时间 08:15；同一任务内串行同步，避免同时修改 data.json
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 所有会写入 data.json 的工作流共用此锁，避免 Git 合并冲突。
  group: fire-platform-data-json-write
  cancel-in-progress: false

jobs:
  sync-inspection-data:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🏗️ 同步北京基地设施巡查数据
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: node scripts/sync_facility_inspections.js

      - name: 🔥 同步北京基地防火巡查数据
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: node scripts/sync_fire_inspections.js

      - name: 📦 一次性提交同步后的巡查数据
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "FireBot"
          git add data.json
          if git diff --staged --quiet; then
            echo "巡查数据无变化，无需提交。"
            exit 0
          fi
          git commit -m "📋 同步巡查数据 $(TZ='Asia/Shanghai' date '+%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main
