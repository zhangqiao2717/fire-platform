name: monthly-maintenance-dispatch

on:
  schedule:
    # 每月 1 日与 25 日 UTC 00:00 = 北京时间 08:00
    - cron: '0 0 1,25 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '执行模式（dispatch 下发任务 / reminder 25日汇总）'
        type: choice
        required: true
        default: dispatch
        options:
          - dispatch
          - reminder
      month:
        description: '指定月份（留空为当前月）'
        required: false

permissions:
  contents: write

# 与其它 data.json 写入任务串行执行，避免自动同步产生 Git 合并冲突。
concurrency:
  group: fire-platform-data-json-write
  cancel-in-progress: false

jobs:
  maintenance-notify:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔧 发送消防保养任务或汇总
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_MAINTENANCE_CHAT_ID: ${{ secrets.FEISHU_MAINTENANCE_CHAT_ID }}
          FIRE_PLATFORM_URL: ${{ secrets.FIRE_PLATFORM_URL }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "$(TZ='Asia/Shanghai' date '+%d')" = "01" ]; then MODE="dispatch"; else MODE="reminder"; fi
          fi
          MONTH_ARG=""
          if [ -n "${{ github.event.inputs.month }}" ]; then MONTH_ARG="--month=${{ github.event.inputs.month }}"; fi
          node scripts/send_monthly_plan.js --mode="$MODE" $MONTH_ARG

      - name: 📦 提交任务状态
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "FireBot"
          git add data.json
          git diff --staged --quiet || git commit -m "🛠️ 更新消防保养任务状态 $(TZ='Asia/Shanghai' date '+%Y-%m-%d')"
          git push
